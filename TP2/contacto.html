  <main>
    <h1>Contacto</h1>
    <h2>Escríbenos</h2>
    <form action="./contacto.html" method="post">
      <label for="id-nombre">Nombre</label>
      <input type="text" name="nombre" id="id-nombre" required>

      <label for="id-telefono">Teléfono</label>
      <input type="tel" name="telefono" id="id-telefono">

      <label for="id-email">Email</label>
      <input type="email" name="email" id="id-email" required>

      <label for="id-direccion">Dirección</label>
      <input type="text" name="direccion" id="id-direccion">

      <label for="id-mensaje">Mensaje</label>
      <textarea name="mensaje" id="id-mensaje" required></textarea>

      <button type="submit">Enviar</button>
    </form>

    <h2>Dónde estamos</h2>
